name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Night Owl colors, matching the theme=nightowl stats cards
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c792ea&color_dots=#0b2942,#285564,#458286,#62aea8,#7fdbca

      # snk's SVG output has a transparent background (color_background only applies to GIFs)
      - run: sudo sed -i 's/<svg /<svg style="background:#011627" /' dist/github-snake.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
